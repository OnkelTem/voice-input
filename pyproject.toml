[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input"
version = "0.1.0"
description = "Offline AI voice dictation daemon for Linux"
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.7.7",
    "sounddevice>=0.5.1",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "PyQt5>=5.15",
    "cffi>=1.16.0",
    "python-xlib>=0.33",
]

[project.scripts]
voice-input = "voice_input.voice_daemon:main"

[tool.setuptools.packages.find]
include = ["voice_input*"]

[tool.setuptools.package-data]
voice_input = ["static/*", "templates/*", "whisper_helper.so"]
